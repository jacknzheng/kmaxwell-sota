loop: gpt_record
run_id: req033_b0.5x_C_s0
seed: 0
require_world_size: 8
train_steps: 3250
batch_tokens: 262144
microbatch_sequences: 32
train_data: data/fineweb10B/fineweb_train_*.bin
val_data: data/fineweb10B/fineweb_val_*.bin
val_tokens: 10485760
model:
  vocab_size: 50304
  num_layers: 12
  model_dim: 768
optimizer_groups:
- pattern: ^embed\.weight$
  optimizer: adamw
  hyperparams:
    lr: 0.7
    weight_decay: 0.001
- pattern: ^proj\.weight$
  optimizer: adamw
  hyperparams:
    lr: 0.004
    weight_decay: 0.001
- pattern: ^blocks\..*\.weight$
  optimizer: annealed_weights_muon
  hyperparams:
    lr: 0.025
    weight_decay: 0.05
    mu: 0.95
    decays:
    - 0.75
    - 0.822852439855
    - 0.877930338626
    - 0.917598547218
    - 0.945180941073
    - 0.963893920846
    - 0.97637869689
    - 0.984615384615
    start_weights:
    - 0.005093975
    - 0.010187949
    - 0.015281924
    - 0.020375898
    - 0.025469873
    - 0.030563847
    - 0.035657822
    - 0.857368713
    end_weights:
    - 0.032261839
    - 0.064523678
    - 0.096785516
    - 0.129047355
    - 0.161309194
    - 0.193571033
    - 0.225832871
    - 0.096668514
    switch_step: 1000
    anneal_end_step: 3250
    warm_streams_before_switch: false
- pattern: .*
  optimizer: adamw
  hyperparams:
    lr: 0.015
    weight_decay: 0.001
setup:
- name: open_rank_zero_log
- name: load_validation_tokens
- name: build_compiled_gpt
- name: seed_then_initialize_parameters
- name: assemble_grouped_optimizer
- name: open_training_batches
- name: broadcast_initial_parameters
- name: load_training_state
  hyperparams:
    state_dir: eos_shared_state
    step: 1000
    skip_batches: 2000
- name: validate_at_step_boundaries
post_optimizer:
- name: print_training_progress
- name: validate_at_step_boundaries
  hyperparams:
    every: 125
    dense_window:
    - 3000
    - 3250
    dense_every: 10
teardown:
- name: mark_log_finished
pre_optimizer:
- name: checkpoint_model_at_cadence
  hyperparams:
    every: 3250
    dump_dir: dumps_req033_b0.5x_C_s0
- name: cool_down_learning_rate
  hyperparams:
    cooldown_frac: 0.7
start_step: 1000
stop_after_step: 3250
