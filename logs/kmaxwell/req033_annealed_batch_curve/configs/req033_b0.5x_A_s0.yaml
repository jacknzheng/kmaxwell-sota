loop: gpt_record
run_id: req033_b0.5x_A_s0
seed: 0
require_world_size: 8
train_steps: 3250
batch_tokens: 262144
microbatch_sequences: 32
train_data: data/fineweb10B/fineweb_train_*.bin
val_data: data/fineweb10B/fineweb_val_*.bin
val_tokens: 10485760
model:
  vocab_size: 50304
  num_layers: 12
  model_dim: 768
optimizer_groups:
- pattern: ^embed\.weight$
  optimizer: adamw
  hyperparams:
    lr: 0.7
    weight_decay: 0.001
- pattern: ^proj\.weight$
  optimizer: adamw
  hyperparams:
    lr: 0.004
    weight_decay: 0.001
- pattern: ^blocks\..*\.weight$
  optimizer: muon
  hyperparams:
    lr: 0.025
    weight_decay: 0.05
    mu: 0.95
- pattern: .*
  optimizer: adamw
  hyperparams:
    lr: 0.015
    weight_decay: 0.001
setup:
- name: open_rank_zero_log
- name: load_validation_tokens
- name: build_compiled_gpt
- name: seed_then_initialize_parameters
- name: assemble_grouped_optimizer
- name: open_training_batches
- name: broadcast_initial_parameters
- name: load_training_state
  hyperparams:
    state_dir: eos_shared_state
    step: 1000
    skip_batches: 2000
- name: validate_at_step_boundaries
post_optimizer:
- name: print_training_progress
- name: validate_at_step_boundaries
  hyperparams:
    every: 125
    dense_window:
    - 3000
    - 3250
    dense_every: 10
teardown:
- name: mark_log_finished
pre_optimizer:
- name: checkpoint_model_at_cadence
  hyperparams:
    every: 3250
    dump_dir: dumps_req033_b0.5x_A_s0
- name: cool_down_learning_rate
  hyperparams:
    cooldown_frac: 0.7
start_step: 1000
stop_after_step: 3250
