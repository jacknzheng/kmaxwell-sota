loop: gpt_record
run_id: plann_pr357_kernel_control
seed: 0
require_world_size: 8
train_steps: 3250
batch_tokens: 524288
microbatch_sequences: 64
train_data: data/fineweb10B/fineweb_train_*.bin
val_data: data/fineweb10B/fineweb_val_*.bin
val_tokens: 10485760
model:
  vocab_size: 50304
  num_layers: 12
  model_dim: 768
optimizer_groups:
- pattern: ^embed\.weight$
  optimizer: adamw
  hyperparams:
    lr: 0.7
    weight_decay: 0.001
- pattern: ^proj\.weight$
  optimizer: adamw
  hyperparams:
    lr: 0.004
    weight_decay: 0.001
- pattern: ^blocks\..*\.weight$
  optimizer: annealed_weights_muon
  hyperparams:
    lr: 0.025
    weight_decay: 0.05
    mu: 0.95
    decays:
    - 0.75
    - 0.8228524398549413
    - 0.8779303386257296
    - 0.9175985472180883
    - 0.9451809410725112
    - 0.9638939208460664
    - 0.976378696890324
    - 0.9846153846153846
    start_weights:
    - 0.005094
    - 0.010188
    - 0.015282
    - 0.020376
    - 0.02547
    - 0.030564
    - 0.035658
    - 0.857369
    end_weights:
    - 0.032262
    - 0.064524
    - 0.096786
    - 0.129047
    - 0.161309
    - 0.193571
    - 0.225833
    - 0.096669
    switch_step: 1000
    anneal_end_step: 3250
    warm_streams_before_switch: false
    bias_correct_streams: false
- pattern: .*
  optimizer: adamw
  hyperparams:
    lr: 0.015
    weight_decay: 0.001
setup:
- name: open_rank_zero_log
- name: load_validation_tokens
- name: build_compiled_gpt
- name: seed_then_initialize_parameters
- name: assemble_grouped_optimizer
- name: open_training_batches
- name: broadcast_initial_parameters
- name: load_training_state
  hyperparams:
    state_dir: warmstart_pl_anneal
    step: 1000
    skip_batches: 1000
- name: validate_at_step_boundaries
pre_optimizer:
- name: cool_down_learning_rate
  hyperparams:
    cooldown_frac: 0.7
post_optimizer:
- name: print_training_progress
- name: validate_at_step_boundaries
  hyperparams:
    every: 125
    final_tenth_every: 25
    dense_window:
    - 2900
    - 3250
    dense_every: 10
teardown:
- name: mark_log_finished
start_step: 1000
