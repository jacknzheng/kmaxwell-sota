loop: gpt_record
run_id: plann_g0p5_g0p75
seed: 0
require_world_size: 8
train_steps: 3250
batch_tokens: 524288
microbatch_sequences: 64
train_data: data/fineweb10B/fineweb_train_*.bin
val_data: data/fineweb10B/fineweb_val_*.bin
val_tokens: 10485760
model:
  vocab_size: 50304
  num_layers: 12
  model_dim: 768
optimizer_groups:
- pattern: ^embed\.weight$
  optimizer: adamw
  hyperparams:
    lr: 0.7
    weight_decay: 0.001
- pattern: ^proj\.weight$
  optimizer: adamw
  hyperparams:
    lr: 0.004
    weight_decay: 0.001
- pattern: ^blocks\..*\.weight$
  optimizer: annealed_weights_muon
  hyperparams:
    lr: 0.025
    weight_decay: 0.05
    mu: 0.95
    decays:
    - 0.09090909090909091
    - 0.24111872622503933
    - 0.502368311286906
    - 0.7623311132910016
    - 0.9106446570289752
    - 0.9700425219426926
    - 0.9903737640973652
    - 0.996950183381501
    - 0.999038110419867
    - 0.9996970614965162
    start_weights:
    - 0.0011022321775728326
    - 0.001749580631816447
    - 0.006631937540914026
    - 0.01518621070636042
    - 0.031874653293167764
    - 0.05722279711386827
    - 0.11181927187350992
    - 0.164487997883433
    - 0.155546944085971
    - 0.4543783746933864
    end_weights:
    - 0.004690678858128857
    - 0.006373671712471024
    - 0.02004942962538024
    - 0.036924585785314906
    - 0.058213810537378806
    - 0.08203117987949624
    - 0.10925012511247131
    - 0.1645215807075443
    - 0.09533208003629626
    - 0.42261285774551804
    switch_step: 1000
    anneal_end_step: 3249
    warm_streams_before_switch: true
    bias_correct_streams: true
- pattern: .*
  optimizer: adamw
  hyperparams:
    lr: 0.015
    weight_decay: 0.001
setup:
- name: open_rank_zero_log
- name: load_validation_tokens
- name: build_compiled_gpt
- name: seed_then_initialize_parameters
- name: assemble_grouped_optimizer
- name: open_training_batches
- name: broadcast_initial_parameters
- name: load_training_state
  hyperparams:
    state_dir: warmstart_pl_anneal
    step: 1000
    skip_batches: 1000
- name: validate_at_step_boundaries
pre_optimizer:
- name: cool_down_learning_rate
  hyperparams:
    cooldown_frac: 0.7
post_optimizer:
- name: print_training_progress
- name: validate_at_step_boundaries
  hyperparams:
    every: 125
    final_tenth_every: 25
    dense_window:
    - 2900
    - 3250
    dense_every: 10
teardown:
- name: mark_log_finished
start_step: 1000
