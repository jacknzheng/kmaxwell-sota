# Reproduction of PR #340's train_gpt_bimaxwell_baseline.py in the modular harness:
# the tuned Muon baseline with bi-Maxwell momentum from Muon step 1000, dense
# eval-only validation over the crossing zone. Launch from repo root:
#   torchrun --standalone --nproc_per_node=8 records/track_3_optimization/run.py \
#       records/track_3_optimization/configs/bimaxwell.yaml seed=0
loop: gpt_record
run_id: bimaxwell
seed: 0
require_world_size: 8
train_steps: 3250
batch_tokens: 524288
microbatch_sequences: 64
train_data: "data/fineweb10B/fineweb_train_*.bin"
val_data: "data/fineweb10B/fineweb_val_*.bin"
val_tokens: 10485760
model: {vocab_size: 50304, num_layers: 12, model_dim: 768}
optimizer_groups:
  - {pattern: '^embed\.weight$', optimizer: adamw, hyperparams: {lr: 0.7, weight_decay: 0.001}}
  - {pattern: '^proj\.weight$', optimizer: adamw, hyperparams: {lr: 0.004, weight_decay: 0.001}}
  - {pattern: '^blocks\..*\.weight$', optimizer: bimaxwell_muon,
     hyperparams: {lr: 0.025, weight_decay: 0.05, mu: 0.95,
                   fast_decay: 0.85, slow_decay: 0.98, fast_weight: 0.4385, switch_step: 1000}}
  - {pattern: '.*', optimizer: adamw, hyperparams: {lr: 0.015, weight_decay: 0.001}}
setup:
  - {name: open_rank_zero_log}
  - {name: load_validation_tokens}
  - {name: build_compiled_gpt}
  - {name: seed_then_initialize_parameters}
  - {name: assemble_grouped_optimizer}
  - {name: open_training_batches}
  - {name: broadcast_initial_parameters}
  - {name: validate_at_step_boundaries}
pre_optimizer:
  - {name: cool_down_learning_rate, hyperparams: {cooldown_frac: 0.7}}
post_optimizer:
  - {name: print_training_progress}
  - {name: validate_at_step_boundaries,
     hyperparams: {every: 125, final_tenth_every: 25, dense_window: [2900, 3250], dense_every: 10}}
teardown:
  - {name: mark_log_finished}
