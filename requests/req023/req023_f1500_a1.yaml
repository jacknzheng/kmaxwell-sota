loop: gpt_record
run_id: req023_f1500_a1
seed: 0
require_world_size: 8
train_steps: 3250
start_step: 1500
stop_after_step: 2350
batch_tokens: 524288
microbatch_sequences: 64
train_data: data/fineweb10B/fineweb_train_*.bin
val_data: data/fineweb10B/fineweb_val_*.bin
val_tokens: 10485760
model:
  vocab_size: 50304
  num_layers: 12
  model_dim: 768
optimizer_groups:
- pattern: ^embed\.weight$
  optimizer: adamw
  hyperparams:
    lr: 0.7
    weight_decay: 0.001
- pattern: ^proj\.weight$
  optimizer: adamw
  hyperparams:
    lr: 0.004
    weight_decay: 0.001
- pattern: ^blocks\..*\.weight$
  optimizer: per_matrix_lr_muon
  hyperparams:
    lr: 0.025
    weight_decay: 0.05
    mu: 0.95
    fast_decay: 0.85
    slow_decay: 0.98
    fast_weight: 0.4385
    switch_step: 1000
