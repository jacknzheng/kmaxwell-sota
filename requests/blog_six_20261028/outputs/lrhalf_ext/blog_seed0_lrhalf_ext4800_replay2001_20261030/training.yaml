    lr: 0.7
    weight_decay: 0.001
  lr_schedule:
    kind: piecewise_constant
    boundaries:
    - 2009
    factors:
    - 1.0
    - 0.5
- pattern: ^proj\.weight$
  optimizer: adamw
  hyperparams:
    lr: 0.004
    weight_decay: 0.001
  lr_schedule:
    kind: piecewise_constant
    boundaries:
    - 2009
    factors:
    - 1.0
    - 0.5
- pattern: ^blocks\..*\.weight$
  optimizer: muon
  hyperparams:
    lr: 0.025
    weight_decay: 0.05
    momentum:
      kind: ema
      decay: 0.95
      nesterov_mix: 0.95
  lr_schedule:
    kind: piecewise_constant
    boundaries:
    - 2009
    factors:
    - 1.0
    - 0.5
- pattern: ^(?!embed\.weight$|proj\.weight$|blocks\..*\.weight$).*
  optimizer: adamw
  hyperparams:
    lr: 0.015
    weight_decay: 0.001
  lr_schedule:
    kind: piecewise_constant
    boundaries:
    - 2009
    factors:
    - 1.0
    - 0.5
