require_world_size: 8
train_steps: 3250
optimizer_groups:
- pattern: ^embed\.weight$
  optimizer: adamw
  hyperparams:
    lr: 0.7
    weight_decay: 0.001
  lr_schedule:
    kind: cooldown
    fraction: 0.7
- pattern: ^proj\.weight$
  optimizer: adamw
  hyperparams:
    lr: 0.004
    weight_decay: 0.001
  lr_schedule:
    kind: cooldown
    fraction: 0.7
- pattern: ^blocks\..*\.weight$
  optimizer: muon
  hyperparams:
    lr: 0.025
    weight_decay: 0.05000000000000001
    momentum:
      kind: switch
      start_step: 1000
      before:
        kind: ema
        decay: 0.95
        nesterov_mix: 0.95
      after:
        kind: interpolate
        start:
          kind: fixed
          schedule:
            kind: maxentslop
            mean_lag: 90
            log_moment: 3.7153849427
            newest_weight: 0.07235
            second_newest_weight: 0.02235
        end:
          kind: fixed
          schedule:
            kind: maxentslop
            mean_lag: 24.05
            log_moment: 2.3786333904
            newest_weight: 0.137
            second_newest_weight: 0.087
        fraction:
          kind: linear
          start: 0
          end: 1
          start_step: 1000
          end_step: 3250
  lr_schedule:
    kind: cooldown
    fraction: 0.7
- pattern: ^(?!embed\.weight$|proj\.weight$|blocks\..*\.weight$).*
  optimizer: adamw
  hyperparams:
    lr: 0.015
    weight_decay: 0.001
  lr_schedule:
    kind: cooldown
    fraction: 0.7
setup:
- name: open_rank_zero_log
- name: load_validation_tokens
- name: build_compiled_gpt
- name: seed_then_initialize_parameters
- name: assemble_grouped_optimizer
- name: open_training_batches
- name: broadcast_initial_parameters
- name: validate_at_step_boundaries
pre_optimizer:
- name: schedule_optimizer_groups
post_optimizer:
- name: print_training_progress
- name: validate_at_step_boundaries
  hyperparams:
    every: 250
    final_tenth_every: 0
    dense_window:
    - 975
    - 975
    dense_every: 1
teardown:
- name: mark_log_finished
initialization:
  zero_projection: true
  weight_scales: {}
seed_offset: 1337
reseed_before_initialization: true
